<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Heliaris 外送員</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#f4f4f5;font-family:system-ui,-apple-system,sans-serif;min-height:100vh}
header{background:#18181b;color:#fff;padding:14px 20px;display:flex;align-items:center;justify-content:space-between}
header h1{font-size:.9rem;font-weight:700;letter-spacing:.06em}
.logout{font-size:.75rem;background:none;border:none;color:#a1a1aa;cursor:pointer}
.logout:hover{color:#fff}
main{max-width:480px;margin:0 auto;padding:18px 14px;display:flex;flex-direction:column;gap:14px}
.card{background:#fff;border:1px solid #e4e4e7;border-radius:12px;padding:20px}
.card-label{font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:#a1a1aa;margin-bottom:14px}
.room-section{margin-bottom:18px}
.room-title{font-size:.95rem;font-weight:700;color:#18181b;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.room-badge{background:#f4f4f5;border-radius:6px;padding:2px 8px;font-size:.72rem;font-weight:600;color:#71717a}
.student-row{display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid #f4f4f5}
.student-row:last-child{border:none}
.student-name{font-size:.88rem;font-weight:600}
.student-id{font-size:.72rem;color:#a1a1aa;margin-top:1px}
.send-btn{background:#18181b;color:#fff;border:none;border-radius:7px;padding:8px 14px;font-size:.78rem;font-weight:600;cursor:pointer}
.send-btn:hover{background:#3f3f46}
.send-btn:disabled{opacity:.35;cursor:not-allowed}
.tip{background:#eff6ff;border:1px solid #bfdbfe;border-radius:10px;padding:14px 16px;font-size:.8rem;color:#1e40af;line-height:1.6}
select{border:1.5px solid #e4e4e7;border-radius:7px;padding:7px 10px;font-size:.82rem;width:100%;margin-bottom:10px;outline:none}
select:focus{border-color:#18181b}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#18181b;color:#fff;border-radius:8px;padding:10px 20px;font-size:.82rem;opacity:0;transition:opacity .3s;pointer-events:none;z-index:999}
.toast.show{opacity:1}
</style>
</head>
<body>
<header>
  <h1>外送員介面</h1>
  <button class="logout" onclick="logout()">登出</button>
</header>
<main>
  <div class="tip">📦 選擇學生後按「送達開箱」，系統會自動開啟對應外送箱並記錄訂單。<br>也可直接按外送箱站上的實體按鈕開啟。</div>

  <div class="card">
    <div class="card-label">選擇商家</div>
    <select id="merchant">
      <option>麥當勞</option><option>肯德基</option><option>摩斯漢堡</option>
      <option>爭鮮壽司</option><option>鬍鬚張</option><option>85度C</option>
      <option>星巴克</option><option>丹堤咖啡</option><option>50嵐</option><option>清心福全</option>
    </select>
  </div>

  <div class="card">
    <div class="card-label">選擇收件學生</div>
    <div id="room-list"></div>
  </div>
</main>
<div class="toast" id="toast"></div>
<script>
function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2500);
}

async function logout(){
  await fetch('/api/logout',{method:'POST'});
  location.href='/login';
}

async function deliver(sid){
  const merchant=document.getElementById('merchant').value;
  const btn=document.getElementById('btn-'+sid);
  btn.disabled=true;
  const res=await fetch('/api/delivery/open',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({student_id:sid,merchant})});
  const d=await res.json();
  if(!res.ok){showToast('❌ '+d.error);btn.disabled=false;return;}
  showToast(`✅ 已開啟 ${d.room} (${d.side==='left'?'左':'右'}箱)`);
  setTimeout(()=>btn.disabled=false,8000);
}

async function load(){
  const res=await fetch('/api/delivery/rooms');
  if(res.status===401){location.href='/login';return;}
  const rooms=await res.json();
  document.getElementById('room-list').innerHTML=rooms.map(r=>`
    <div class="room-section">
      <div class="room-title">${r.room}<span class="room-badge">${r.students.length} 人</span></div>
      ${r.students.map(s=>`<div class="student-row">
        <div><div class="student-name">${s.name}</div><div class="student-id">${s.student_id}</div></div>
        <button class="send-btn" id="btn-${s.student_id}" onclick="deliver('${s.student_id}')">送達開箱</button>
      </div>`).join('')}
    </div>`).join('');
}
load();
</script>
</body>
</html>
