<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Heliaris 管理員</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#f4f4f5;font-family:system-ui,-apple-system,sans-serif;min-height:100vh;padding-bottom:72px}

/* ── header ─────────────────────────────────────────── */
header{background:#18181b;color:#fff;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10}
header h1{font-size:.9rem;font-weight:700;letter-spacing:.06em}
.hbtns{display:flex;gap:8px}
.hbtn{font-size:.75rem;background:none;border:1px solid #3f3f46;color:#a1a1aa;border-radius:6px;padding:5px 10px;cursor:pointer;display:flex;align-items:center;gap:4px}
.hbtn:hover{color:#fff;border-color:#71717a}
.hbtn svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ── tab bar ─────────────────────────────────────────── */
.tab-bar{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #e4e4e7;display:flex;z-index:20;height:64px}
.tab-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer;color:#a1a1aa;transition:color .15s;border:none;background:none;padding:8px 0}
.tab-item.active{color:#18181b}
.tab-item svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab-item span{font-size:.64rem;font-weight:600;letter-spacing:.03em}

/* ── sections ────────────────────────────────────────── */
.section{display:none;max-width:520px;margin:0 auto;padding:18px 14px;flex-direction:column;gap:14px}
.section.active{display:flex}
.card{background:#fff;border:1px solid #e4e4e7;border-radius:12px;padding:20px}
.card-label{font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:#a1a1aa;margin-bottom:14px;display:flex;align-items:center;gap:6px}
.card-label svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ── month picker (scrollable pill carousel) ─────────── */
.month-picker-wrap{position:relative;margin-bottom:18px}
.month-picker-wrap::after{content:'';position:absolute;right:0;top:0;bottom:4px;width:48px;background:linear-gradient(90deg,transparent,#fff);pointer-events:none;border-radius:0 10px 10px 0}
.month-picker{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:4px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.month-picker::-webkit-scrollbar{display:none}
.mpill{scroll-snap-align:start;flex-shrink:0;display:flex;flex-direction:column;align-items:center;justify-content:center;border:2px solid #e4e4e7;border-radius:14px;padding:10px 16px;cursor:pointer;background:#fff;min-width:66px;transition:all .2s ease;user-select:none}
.mpill:hover{border-color:#71717a;background:#fafafa}
.mpill .mp-year{font-size:.58rem;color:#a1a1aa;line-height:1;margin-bottom:3px;font-weight:500}
.mpill .mp-mon{font-size:1.2rem;font-weight:900;line-height:1;color:#18181b}
.mpill .mp-unit{font-size:.58rem;color:#71717a;margin-top:2px}
.mpill.active{background:#18181b;border-color:#18181b;transform:scale(1.06);box-shadow:0 4px 12px rgba(0,0,0,.18)}
.mpill.active .mp-year{color:#71717a}
.mpill.active .mp-mon,.mpill.active .mp-unit{color:#fff}

/* ── bar chart ───────────────────────────────────────── */
.bar-row{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid #f4f4f5}
.bar-row:last-child{border:none}
.bar-room{width:38px;font-size:.8rem;font-weight:700;color:#18181b}
.bar-wrap{flex:1;background:#f4f4f5;border-radius:4px;height:10px;overflow:hidden}
.bar{height:100%;border-radius:4px;background:#18181b;transition:width .5s}
.bar-cnt{width:32px;text-align:right;font-size:.78rem;color:#71717a}

/* ── co2 ─────────────────────────────────────────────── */
.co2-row{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid #f4f4f5}
.co2-row:last-child{border:none}
.co2-room{width:38px;font-size:.8rem;font-weight:700;color:#18181b}
.co2-bar-wrap{flex:1;background:#f4f4f5;border-radius:4px;height:8px;overflow:hidden}
.co2-bar{height:100%;border-radius:4px;transition:width .5s}
.co2-val{min-width:58px;text-align:right;font-size:.78rem;font-weight:700}
.co2-low .co2-bar{background:#22c55e} .co2-low .co2-val{color:#16a34a}
.co2-mid .co2-bar{background:#f59e0b} .co2-mid .co2-val{color:#d97706}
.co2-high .co2-bar{background:#ef4444} .co2-high .co2-val{color:#dc2626}

/* ── rank section ────────────────────────────────────── */
.rank-month-tabs{display:flex;gap:6px;margin-bottom:16px;background:#f4f4f5;border-radius:10px;padding:4px}
.rmt{flex:1;text-align:center;border:none;background:none;border-radius:7px;padding:8px 4px;font-size:.76rem;font-weight:600;color:#71717a;cursor:pointer;transition:all .15s;white-space:nowrap}
.rmt.active{background:#fff;color:#18181b;box-shadow:0 1px 4px rgba(0,0,0,.1)}
.rank-card{display:flex;align-items:center;gap:14px;padding:12px 0;border-bottom:1px solid #f4f4f5}
.rank-card:last-child{border:none}
.rank-medal{width:54px;height:54px;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.rank-medal img{width:54px;height:54px;object-fit:contain}
.medal-fallback{width:50px;height:50px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.15rem;font-weight:900;border:3px solid;display:none}
.mf1{background:#fef3c7;border-color:#f59e0b;color:#92400e}
.mf2{background:#f1f5f9;border-color:#94a3b8;color:#475569}
.mf3{background:#fde68a;border-color:#d97706;color:#a16207}
.mf4{background:#f0fdf4;border-color:#22c55e;color:#166534}
.mf5{background:#f5f3ff;border-color:#8b5cf6;color:#5b21b6}
.rank-info{flex:1}
.rank-name{font-size:.95rem;font-weight:700;display:flex;align-items:center;flex-wrap:wrap;gap:5px}
.rank-sub{font-size:.74rem;color:#71717a;margin-top:3px}
.rank-tag{font-size:.64rem;font-weight:700;background:#18181b;color:#fff;border-radius:4px;padding:2px 6px}
.rank-eco{font-size:.64rem;font-weight:700;background:#dcfce7;color:#166534;border-radius:4px;padding:2px 6px}

/* ── merchant section ────────────────────────────────── */
.merchant-row{display:flex;align-items:center;justify-content:space-between;padding:11px 0;border-bottom:1px solid #f4f4f5}
.merchant-row:last-child{border:none}
.merchant-left{display:flex;align-items:center;gap:8px;min-width:0}
.merchant-name{font-weight:600;font-size:.88rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cat-badge{background:#f4f4f5;border-radius:5px;padding:2px 7px;font-size:.66rem;font-weight:600;color:#52525b;flex-shrink:0}
.menu-btn{font-size:.72rem;font-weight:600;border:1.5px solid #e4e4e7;border-radius:7px;padding:5px 11px;background:#fff;color:#18181b;cursor:pointer;white-space:nowrap;flex-shrink:0;display:flex;align-items:center;gap:4px}
.menu-btn:hover{background:#f4f4f5;border-color:#a1a1aa}
.menu-btn svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2.5}
.add-form{display:flex;flex-direction:column;gap:10px;margin-top:14px;padding-top:14px;border-top:1px solid #f4f4f5}
.add-form input,.add-form select{border:1.5px solid #e4e4e7;border-radius:8px;padding:10px 12px;font-size:.85rem;width:100%;outline:none;font-family:inherit}
.add-form input:focus,.add-form select:focus{border-color:#18181b}
.add-btn{background:#18181b;color:#fff;border:none;border-radius:8px;padding:11px;font-size:.85rem;font-weight:600;cursor:pointer}
.add-btn:hover{background:#3f3f46}

/* ── menu modal ──────────────────────────────────────── */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;align-items:flex-end;justify-content:center}
.modal-overlay.open{display:flex}
.modal-box{background:#fff;border-radius:20px 20px 0 0;width:100%;max-width:520px;max-height:82vh;overflow:hidden;display:flex;flex-direction:column;animation:slideUp .25s ease}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.modal-header{padding:18px 20px 14px;border-bottom:1px solid #e4e4e7;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.modal-title{font-size:1.05rem;font-weight:700}
.modal-cat{font-size:.68rem;background:#f4f4f5;border-radius:5px;padding:2px 8px;color:#52525b;margin-left:8px;font-weight:600}
.modal-close{background:none;border:none;font-size:1.3rem;cursor:pointer;color:#71717a;padding:4px;line-height:1;border-radius:6px}
.modal-close:hover{background:#f4f4f5;color:#18181b}
.modal-body{overflow-y:auto;padding:4px 20px 28px;flex:1}
.menu-item{padding:13px 0;border-bottom:1px solid #f4f4f5}
.menu-item:last-child{border:none}
.menu-item-top{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.menu-item-name{font-size:.9rem;font-weight:600;flex:1}
.menu-item-price{font-size:.95rem;font-weight:700;color:#18181b;flex-shrink:0}
.menu-item-meta{display:flex;align-items:center;gap:5px;margin-top:6px;flex-wrap:wrap}
.co2-badge{font-size:.63rem;font-weight:700;border-radius:5px;padding:2px 7px;flex-shrink:0}
.co2-badge.low{background:#dcfce7;color:#166534}
.co2-badge.mid{background:#fef9c3;color:#854d0e}
.co2-badge.high{background:#fee2e2;color:#991b1b}
.addon-tag{font-size:.63rem;background:#f4f4f5;border-radius:4px;padding:2px 6px;color:#52525b}

/* ── student list ─────────────────────────────────────── */
.student-room-group{margin-bottom:14px}
.student-room-label{font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#a1a1aa;margin-bottom:6px;padding:0 2px}
.s-row{display:flex;align-items:center;justify-content:space-between;padding:9px 12px;background:#f9f9fa;border-radius:9px;margin-bottom:5px}
.s-row:last-child{margin-bottom:0}
.s-name{font-size:.88rem;font-weight:600}
.s-id{font-size:.7rem;color:#a1a1aa;margin-top:2px}
.s-room-badge{font-size:.65rem;background:#18181b;color:#fff;border-radius:5px;padding:2px 8px;font-weight:600;flex-shrink:0}
</style>
</head>
<body>

<header>
  <h1>Heliaris MVP v0.2 管理介面</h1>
  <div class="hbtns">
    <button class="hbtn" onclick="logout()">
      <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      登出
    </button>
  </div>
</header>
<!-- ── 統計 ───────────────────────────────────────────── -->
<div class="section active" id="sec-stats">
  <div class="card">
    <div class="card-label">
      <svg viewBox="0 0 24 24"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
      外送統計
    </div>
    <div class="month-picker-wrap">
      <div class="month-picker" id="month-picker"></div>
    </div>
    <div id="bar-chart"></div>
  </div>
  <div class="card">
    <div class="card-label">
      <svg viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
      碳排放估算
    </div>
    <div id="co2-list"></div>
    <div style="font-size:.66rem;color:#a1a1aa;margin-top:12px;line-height:1.6">依各商家菜單平均碳排計算，含食材生產、包裝與運送。<br>🟢 &lt;5 kg　🟡 5–15 kg　🔴 &gt;15 kg</div>
  </div>
</div>

<!-- ── 排行 ───────────────────────────────────────────── -->
<div class="section" id="sec-rank">
  <div class="card">
    <div class="card-label">
      <svg viewBox="0 0 24 24"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2z"/></svg>
      環保排行榜
    </div>
    <div class="rank-month-tabs" id="rank-month-tabs"></div>
    <div id="rank-list"></div>
  </div>
</div>

<!-- ── 店家 ───────────────────────────────────────────── -->
<div class="section" id="sec-merchants">
  <div class="card">
    <div class="card-label">
      <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      合作店家
    </div>
    <div id="merchant-list"></div>
    <div class="add-form">
      <input id="inp-merchant" placeholder="店家名稱" type="text">
      <select id="inp-cat">
        <option value="">選擇分類</option>
        <option>速食</option><option>日式</option><option>台式</option>
        <option>咖啡</option><option>飲料</option><option>飲料/甜點</option><option>其他</option>
      </select>
      <button class="add-btn" onclick="addMerchant()">新增店家</button>
    </div>
  </div>
</div>

<!-- ── 學生 ───────────────────────────────────────────── -->
<div class="section" id="sec-students">
  <div class="card">
    <div class="card-label">
      <svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      學生名冊
    </div>
    <div id="student-list"></div>
  </div>
</div>

<!-- ── tab bar ────────────────────────────────────────── -->
<nav class="tab-bar">
  <button class="tab-item active" onclick="switchTab('stats',0)">
    <svg viewBox="0 0 24 24"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
    <span>統計</span>
  </button>
  <button class="tab-item" onclick="switchTab('rank',1)">
    <svg viewBox="0 0 24 24"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2z"/></svg>
    <span>排行</span>
  </button>
  <button class="tab-item" onclick="switchTab('merchants',2)">
    <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
    <span>店家</span>
  </button>
  <button class="tab-item" onclick="switchTab('students',3)">
    <svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
    <span>學生</span>
  </button>
</nav>

<!-- ── merchant menu modal ────────────────────────────── -->
<div class="modal-overlay" id="menu-modal" onclick="closeMenuModal()">
  <div class="modal-box" onclick="event.stopPropagation()">
    <div class="modal-header">
      <div style="display:flex;align-items:center;min-width:0">
        <span class="modal-title" id="modal-merchant-name"></span>
        <span class="modal-cat" id="modal-merchant-cat"></span>
      </div>
      <button class="modal-close" onclick="closeMenuModal()">✕</button>
    </div>
    <div class="modal-body" id="modal-menu-list"></div>
  </div>
</div>

// ── 登出 ──────────────────────────────────────────────
async function logout(){await fetch('/api/logout',{method:'POST'});location.href='/login';}

// ── Tab 切換 ──────────────────────────────────────────
function switchTab(name,idx){
  document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));
  document.querySelectorAll('.tab-item').forEach((t,i)=>t.classList.toggle('active',i===idx));
  document.getElementById('sec-'+name).classList.add('active');
}

function co2Class(g){return g<500?'low':g<1200?'mid':'high';}
function co2Label(g){return g<1000?g+'g CO₂e':(g/1000).toFixed(1)+'kg CO₂e';}

// ── 統計 ─────────────────────────────────────────────
let allStats=[], roomMerchantStats=[], months=[], curMonth='';

function renderMonthPicker(){
  const el=document.getElementById('month-picker');
  el.innerHTML=months.map(m=>{
    const [y,mo]=m.split('-');
    return `<div class="mpill${m===curMonth?' active':''}" onclick="selectMonth('${m}')">
      <div class="mp-year">${y}</div>
      <div class="mp-mon">${parseInt(mo)}</div>
      <div class="mp-unit">月</div>
    </div>`;
  }).join('');
  const active=el.querySelector('.mpill.active');
  if(active) active.scrollIntoView({block:'nearest',inline:'center',behavior:'smooth'});
}

function renderChart(){
  const monthData=allStats.filter(r=>r.month===curMonth);
  const maxCnt=Math.max(...monthData.map(r=>r.count),1);
  document.getElementById('bar-chart').innerHTML=monthData.length
    ?monthData.map(r=>`<div class="bar-row">
        <div class="bar-room">${r.room}</div>
        <div class="bar-wrap"><div class="bar" style="width:${Math.round(r.count/maxCnt*100)}%"></div></div>
        <div class="bar-cnt">${r.count}</div>
      </div>`).join('')
    :'<div style="font-size:.82rem;color:#a1a1aa;padding:8px 0">本月尚無資料</div>';

  // 使用商家平均碳排計算各房間CO₂
  const rms=roomMerchantStats.filter(r=>r.month===curMonth);
  const roomCo2={};
  rms.forEach(r=>{
    const avg=(MENU_DATA[r.merchant]||{co2_avg:800}).co2_avg;
    roomCo2[r.room]=(roomCo2[r.room]||0)+r.count*avg;
  });
  monthData.forEach(r=>{if(!roomCo2[r.room]) roomCo2[r.room]=r.count*800;});

  const maxCo2=Math.max(...monthData.map(r=>roomCo2[r.room]||0),1);
  document.getElementById('co2-list').innerHTML=monthData.length
    ?monthData.map(r=>{
        const g=roomCo2[r.room]||0;
        const cls=g<5000?'low':g<15000?'mid':'high';
        const pct=Math.round(g/maxCo2*100);
        return `<div class="co2-row co2-${cls}">
          <div class="co2-room">${r.room}</div>
          <div class="co2-bar-wrap"><div class="co2-bar" style="width:${pct}%"></div></div>
          <div class="co2-val">${(g/1000).toFixed(1)} kg</div>
        </div>`;
      }).join('')
    :'<div style="font-size:.82rem;color:#a1a1aa;padding:8px 0">本月尚無資料</div>';
}

function selectMonth(m){
  curMonth=m;
  renderMonthPicker();
  renderChart();
}

// ── 排行 ─────────────────────────────────────────────
let rankMonths=[], curRankMonth='', allRankings={};

function renderRankMonthTabs(){
  document.getElementById('rank-month-tabs').innerHTML=rankMonths.map(m=>{
    const [y,mo]=m.split('-');
    return `<button class="rmt${m===curRankMonth?' active':''}" onclick="selectRankMonth('${m}')">${y}/${parseInt(mo)}月</button>`;
  }).join('');
}

async function selectRankMonth(m){
  curRankMonth=m;
  renderRankMonthTabs();
  if(!allRankings[m]){
    const res=await fetch(`/api/rankings?month=${m}`);
    allRankings[m]=await res.json();
  }
  renderRankings(allRankings[m]);
}

function medalEl(i){
  const fb=['mf1','mf2','mf3','mf4','mf5'][i]||'mf5';
  return `<div class="rank-medal">
    <img src="/image/no${i+1}.png"
         alt="${i+1}"
         onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">
    <div class="medal-fallback ${fb}">${i+1}</div>
  </div>`;
}

function renderRankings(rankings){
  document.getElementById('rank-list').innerHTML=rankings.length
    ?rankings.map((r,i)=>`<div class="rank-card">
        ${medalEl(i)}
        <div class="rank-info">
          <div class="rank-name">
            ${r.room}
            ${i===0?'<span class="rank-tag">環保冠軍</span><span class="rank-eco">🌿 最少外送</span>':''}
          </div>
          <div class="rank-sub">本月外送 ${r.count} 單</div>
        </div>
      </div>`).join('')
    :'<div style="font-size:.82rem;color:#a1a1aa;padding:8px 0">本月尚無資料</div>';
}

// ── 店家 ─────────────────────────────────────────────
async function loadMerchants(){
  const res=await fetch('/api/merchants');
  const items=await res.json();
  document.getElementById('merchant-list').innerHTML=items.length
    ?items.map(m=>`<div class="merchant-row">
        <div class="merchant-left">
          <span class="merchant-name">${m.name}</span>
          <span class="cat-badge">${m.category||'未分類'}</span>
        </div>
        <button class="menu-btn" onclick="openMenuModal('${m.name}')">
          <svg viewBox="0 0 24 24"><path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"/><rect x="9" y="3" width="6" height="4" rx="1"/><line x1="9" y1="12" x2="15" y2="12"/><line x1="9" y1="16" x2="13" y2="16"/></svg>
          菜單
        </button>
      </div>`).join('')
    :'<div style="font-size:.82rem;color:#a1a1aa;padding:8px 0">尚無店家</div>';
}

async function addMerchant(){
  const name=document.getElementById('inp-merchant').value.trim();
  const category=document.getElementById('inp-cat').value;
  if(!name)return;
  const res=await fetch('/api/merchants',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,category})});
  if(res.ok){document.getElementById('inp-merchant').value='';loadMerchants();}
  else{const d=await res.json();alert(d.error||'新增失敗');}
}

// ── 菜單 Modal ───────────────────────────────────────
function openMenuModal(name){
  const data=MENU_DATA[name];
  document.getElementById('modal-merchant-name').textContent=name;
  document.getElementById('modal-merchant-cat').textContent=data?data.category:'';
  if(!data||!data.items||!data.items.length){
    document.getElementById('modal-menu-list').innerHTML=
      '<div style="font-size:.85rem;color:#a1a1aa;padding:24px 0;text-align:center">暫無菜單資料</div>';
  } else {
    document.getElementById('modal-menu-list').innerHTML=data.items.map(item=>{
      const cls=co2Class(item.co2);
      const addons=(item.addons&&item.addons.length)
        ?item.addons.map(a=>`<span class="addon-tag">${a}</span>`).join(''):'';
      return `<div class="menu-item">
        <div class="menu-item-top">
          <span class="menu-item-name">${item.name}</span>
          <span class="menu-item-price">$${item.price}</span>
        </div>
        <div class="menu-item-meta">
          <span class="co2-badge ${cls}" title="碳排放量估算">🌱 ${co2Label(item.co2)}</span>
          ${addons}
        </div>
      </div>`;
    }).join('');
  }
  document.getElementById('menu-modal').classList.add('open');
  document.body.style.overflow='hidden';
}
function closeMenuModal(){
  document.getElementById('menu-modal').classList.remove('open');
  document.body.style.overflow='';
}

// ── 學生（list 版）──────────────────────────────────
function renderStudents(students){
  const grouped={};
  students.forEach(s=>(grouped[s.room]=grouped[s.room]||[]).push(s));
  document.getElementById('student-list').innerHTML=
    Object.entries(grouped).map(([room,list])=>
      `<div class="student-room-group">
        <div class="student-room-label">${room}</div>
        ${list.map(s=>`<div class="s-row">
          <div>
            <div class="s-name">${s.name}</div>
            <div class="s-id">${s.student_id}</div>
          </div>
          <span class="s-room-badge">${room}</span>
        </div>`).join('')}
      </div>`
    ).join('');
}

// ── 初始載入 ─────────────────────────────────────────
async function load(){
  const meRes=await fetch('/api/me');
  if(meRes.status===401){location.href='/login';return;}
  const me=await meRes.json();


  const [sr, rmsr, stuR]=await Promise.all([
    fetch('/api/room-stats'),
    fetch('/api/room-merchant-stats'),
    fetch('/api/students'),
  ]);
  if(sr.status===401){location.href='/login';return;}

  allStats=await sr.json();
  roomMerchantStats=rmsr.ok?await rmsr.json():[];
  const students=await stuR.json();

  months=[...new Set(allStats.map(r=>r.month))].sort().reverse();
  curMonth=months[0]||'';
  renderMonthPicker();
  renderChart();

  rankMonths=months.slice(0,3);
  curRankMonth=rankMonths[0]||'';
  renderRankMonthTabs();
  if(curRankMonth){
    const rr=await fetch(`/api/rankings?month=${curRankMonth}`);
    allRankings[curRankMonth]=await rr.json();
    renderRankings(allRankings[curRankMonth]);
  }

  renderStudents(students);
  loadMerchants();
}

load();
</script>
